---
# Selene standard-library definition for the Neovim Lua runtime.
# Referenced by selene.toml via `std = "neovim"`.
base: luaJIT

globals:
  vim:
    any: true
  assert:
    args:
      - type: bool
      - type: string
        required: false
  P:
    args:
      - type: any
  R:
    args:
      - type: string
  RELOAD:
    args:
      - type: string
      - type: bool
        required: false
